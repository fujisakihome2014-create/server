<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>UV Proxy Client</title>
    <!-- bare-muxを復活 -->
    <script src="/baremux/index.js"></script>
    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv.config.js"></script>
</head>
<body style="background: #0d1117; color: #c9d1d9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div id="loading"><h3 id="msg">プロキシを初期化中...</h3></div>
    <div id="app" style="display: none; width: 400px; text-align: center;">
        <input id="url" placeholder="URLを入力 (例: https://google.com)" style="width: 100%; padding: 10px; background: #161b22; color: #fff; border: 1px solid #30363d; box-sizing: border-box;" />
        <button onclick="go()" style="width: 100%; padding: 10px; margin-top: 10px; background: #238636; border: none; color: #fff; cursor: pointer;">GO</button>
    </div>

    <script>
        (async () => {
            try {
                const msg = document.getElementById('msg');
                msg.textContent = 'トランスポートを設定中...';

                const connection = new BareMux.BareMuxConnection('/baremux/worker.js');
                
                // 自サーバーのWispを最優先し、外部Wispをバックアップにする（最強の接続対策）
                const wispUrl = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/wisp/';
                await connection.setTransport(
                    '/epoxy/index.mjs',
                    [
                        { wisp: wispUrl }, // 1番目：自分のサーバーのWisp
                        { wisp: 'wss://wisp.mercurywork.shop/' }, // 2番目以降：外部Wisp
                        { wisp: 'wss://wisp.epoxy.cool/' }
                    ]
                );
                
                msg.textContent = 'Service Workerを登録中...';
                await navigator.serviceWorker.register('/sw.js', { scope: __uv$config.prefix });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            } catch (err) {
                console.error(err);
                document.getElementById('msg').textContent = 'エラー: ' + err.message;
            }
        })();

        function go() {
            let url = document.getElementById('url').value.trim();
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            location.href = __uv$config.prefix + __uv$config.encodeUrl(url);
        }
    </script>
</body>
</html>
