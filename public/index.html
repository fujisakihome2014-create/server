<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Client</title>
    <!-- bare-mux / Ultraviolet に必要なスクリプトを読み込む -->
    <script src="/baremux/index.js"></script>
    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        body, html {
          height: 100%;
          width: 100%;
          font-family: 'Roboto', 'Arial', sans-serif;
          background-color: #0d1117;
          color: #c9d1d9;
          overflow: hidden;
          opacity: 0;
          animation: fadeInPage 0.5s ease forwards;
        }

        @keyframes fadeInPage {
          to { opacity: 1; }
        }

        #topBar {
          display: flex;
          flex-direction: row;
          align-items: center;
          width: 100%;
          gap: 8px;
          padding: 12px;
          background: #0d1117;
          z-index: 100;
          position: relative;
        }

        #urlForm {
          display: flex;
          align-items: center;
          flex: 1;
        }

        @property --grad-angle {
          syntax: '<angle>';
          inherits: false;
          initial-value: 135deg;
        }
        @property --grad-c1 {
          syntax: '<color>';
          inherits: false;
          initial-value: #38bdf8;
        }
        @property --grad-c2 {
          syntax: '<color>';
          inherits: false;
          initial-value: #60a5fa;
        }
        @property --grad-c3 {
          syntax: '<color>';
          inherits: false;
          initial-value: #2563eb;
        }
        @property --grad-c4 {
          syntax: '<color>';
          inherits: false;
          initial-value: #38bdf8;
        }

        .url-bar-wrapper {
          position: relative;
          background-color: #161b22;
          border: 1px solid #30363d;
          border-radius: 6px;
          padding: 4px 8px;
          display: flex;
          align-items: center;
          height: 44px;
          width: 100%;
          box-shadow: 0 1px 0 rgba(27, 31, 36, 0.04);
          transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .url-bar-wrapper:focus-within {
          border-color: transparent;
          background-image:
            linear-gradient(#161b22, #161b22),
            linear-gradient(var(--grad-angle, 135deg), var(--grad-c1, #38bdf8), var(--grad-c2, #60a5fa), var(--grad-c3, #2563eb), var(--grad-c4, #38bdf8));
          background-origin: border-box;
          background-clip: padding-box, border-box;
          background-size: 100% 100%, 300% 300%;
          box-shadow: 0 0 14px rgba(56, 189, 248, 0.28), 0 0 6px rgba(37, 99, 235, 0.28);
          transition:
            --grad-angle 1.6s ease,
            --grad-c1 1.6s ease,
            --grad-c2 1.6s ease,
            --grad-c3 1.6s ease,
            --grad-c4 1.6s ease,
            background-position 1.6s ease,
            box-shadow 0.3s ease,
            border-color 0.3s ease;
        }

        #urlInput {
          width: 100%;
          background: transparent;
          border: none;
          color: #f0f6fc;
          font-size: 14px;
          padding: 0 8px;
          outline: none;
        }

        #urlInput::placeholder {
          color: #6e7681;
        }

        #viewArea {
          position: relative;
          height: calc(100% - 68px);
          width: calc(100% - 24px);
          margin: 0 12px 12px 12px;
          background-color: #161b22;
          border: 1px solid #30363d;
          border-radius: 6px;
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }

        #siteFrame {
          width: 100%;
          height: 100%;
          border: none;
          background-color: #161b22;
          position: relative;
          z-index: 2;
        }

        #overlay {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -40%);
          background-color: #161b22;
          border: 1px solid #30363d;
          padding: 16px 24px;
          border-radius: 8px;
          display: flex;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          z-index: 10;
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
          text-align: center;
          opacity: 0;
          visibility: hidden;
          transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
        }

        #overlay.active {
          opacity: 1;
          visibility: visible;
          transform: translate(-50%, -50%);
        }

        .spinner {
          width: 22px;
          height: 22px;
          border: 2px solid #30363d;
          border-top-color: #38bdf8;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
          margin-bottom: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #statusText {
          font-size: 13px;
          color: #c9d1d9;
        }

        #errorToast {
          position: absolute;
          top: 16px;
          right: 16px;
          background: rgba(74, 18, 18, 0.9);
          border: 1px solid #f87171;
          color: #ffe4e4;
          padding: 12px 16px;
          border-radius: 6px;
          font-size: 13px;
          z-index: 1000;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
          opacity: 0;
          visibility: hidden;
          transform: translateY(-15px);
          transition: all 0.3s ease;
          max-width: 520px;
          width: 100%;
        }

        #errorToast.active {
          opacity: 1;
          visibility: visible;
          transform: translateY(0);
        }

        .error-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-weight: bold;
          color: #fca5a5;
          margin-bottom: 6px;
          border-bottom: 1px solid rgba(248, 113, 113, 0.4);
          padding-bottom: 4px;
        }

        .error-time {
          font-size: 11px;
          color: #fca5a5;
          font-weight: normal;
          opacity: 0.85;
        }

        .error-detail {
          font-family: monospace;
          font-size: 11px;
          color: #ffffff;
          word-break: break-all;
          white-space: pre-wrap;
          line-height: 1.4;
          max-height: 200px;
          overflow-y: auto;
        }

        /* ?url= で他ページに埋め込まれた時、自分のUIを消して中身だけ全画面表示にする */
        body.embedded #topBar {
          display: none;
        }

        body.embedded #viewArea {
          margin: 0;
          border: none;
          border-radius: 0;
          height: 100%;
          width: 100%;
        }
    </style>
</head>
<body>
    <div id="topBar">
        <div id="urlForm">
            <div class="url-bar-wrapper">
                <input id="urlInput" placeholder="URLまたは検索ワードを入力" onkeydown="if(event.key === 'Enter') goProxy();" autocomplete="off" spellcheck="false" />
            </div>
        </div>
    </div>

    <div id="viewArea">
        <div id="overlay">
            <div class="spinner"></div>
            <div id="statusText">接続中...</div>
        </div>
        <iframe id="siteFrame" name="siteFrame"></iframe>
    </div>

    <div id="errorToast">
        <div class="error-header">
            <span>⚠️ システム・リソースエラー通知</span>
            <span id="errorTime" class="error-time"></span>
        </div>
        <div id="errorDetail" class="error-detail"></div>
    </div>

    <script src="/register-sw.js"></script>
    <script>
        // ---- フォーカス中、枠のグラデーション(青〜水色の範囲内)をランダムに変化させ続ける ----
        (() => {
            const palette = ['#1d4ed8', '#2563eb', '#3b82f6', '#38bdf8', '#22d3ee', '#0ea5e9', '#60a5fa'];
            const wrapper = document.querySelector('.url-bar-wrapper');
            let gradientTimer = null;

            function pickRandomColors(count) {
                const shuffled = [...palette].sort(() => Math.random() - 0.5);
                const picked = [];
                for (let i = 0; i < count; i++) picked.push(shuffled[i % shuffled.length]);
                return picked;
            }

            function randomizeGradient() {
                const [c1, c2, c3, c4] = pickRandomColors(4);
                const angle = Math.floor(Math.random() * 360);
                const posX = Math.floor(Math.random() * 100);
                const posY = Math.floor(Math.random() * 100);

                wrapper.style.setProperty('--grad-angle', angle + 'deg');
                wrapper.style.setProperty('--grad-c1', c1);
                wrapper.style.setProperty('--grad-c2', c2);
                wrapper.style.setProperty('--grad-c3', c3);
                wrapper.style.setProperty('--grad-c4', c4);
                wrapper.style.backgroundPosition = '0% 0%, ' + posX + '% ' + posY + '%';
            }

            document.getElementById('urlInput').addEventListener('focus', () => {
                randomizeGradient();
                gradientTimer = setInterval(randomizeGradient, 1600);
            });

            document.getElementById('urlInput').addEventListener('blur', () => {
                if (gradientTimer) {
                    clearInterval(gradientTimer);
                    gradientTimer = null;
                }
            });
        })();

        let errorTimer = null;
        let loadTimeoutTimer = null;
        let isNavigating = false;

        // bare-mux接続(ページを跨いで保持し続ける必要があるため、iframe遷移方式と組み合わせる)
        const connection = new BareMux.BareMuxConnection('/baremux/worker.js');

        function showErrorToast(errorText) {
            hideLoading();
            const errorToast = document.getElementById('errorToast');
            const errorDetail = document.getElementById('errorDetail');
            const errorTime = document.getElementById('errorTime');

            const now = new Date();
            errorTime.textContent = now.toLocaleTimeString();

            errorDetail.textContent = errorText;
            errorToast.classList.add('active');

            if (errorTimer) clearTimeout(errorTimer);
            errorTimer = setTimeout(() => {
                errorToast.classList.remove('active');
            }, 15000);
        }

        function showLoading() {
            isNavigating = true;
            document.getElementById('overlay').classList.add('active');

            if (loadTimeoutTimer) clearTimeout(loadTimeoutTimer);
            loadTimeoutTimer = setTimeout(() => {
                if (isNavigating) {
                    showErrorToast("タイムアウト: 15秒以内にサーバーから応答がありませんでした。");
                    isNavigating = false;
                }
            }, 15000);
        }

        function hideLoading() {
            isNavigating = false;
            document.getElementById('overlay').classList.remove('active');
            if (loadTimeoutTimer) {
                clearTimeout(loadTimeoutTimer);
                loadTimeoutTimer = null;
            }
        }

        async function ensureTransportReady() {
            // Service Workerを登録
            await registerSW();

            // wisp接続先(このサーバー自身)をtransportとして設定
            const wispUrl =
                (location.protocol === 'https:' ? 'wss' : 'ws') +
                '://' + location.host + '/wisp/';

            if ((await connection.getTransport()) !== '/epoxy/index.mjs') {
                await connection.setTransport('/epoxy/index.mjs', [{ wisp: wispUrl }]);
            }
        }

        async function goProxy() {
            try {
                document.getElementById('errorToast').classList.remove('active');
                if (errorTimer) clearTimeout(errorTimer);

                let rawInput = document.getElementById('urlInput').value;
                let url = rawInput.trim();

                if (!url) {
                    showErrorToast("ValidationError: URL入力欄が空です。");
                    return;
                }

                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    if (url.includes('.') && !url.includes(' ')) {
                        url = 'https://' + url;
                    } else {
                        url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
                    }
                }

                showLoading();

                try {
                    await ensureTransportReady();
                } catch (err) {
                    showErrorToast("接続の初期化に失敗しました: " + err.message);
                    return;
                }

                loadWithRetry(url);

            } catch (err) {
                showErrorToast("予期しないエラーが発生しました: " + err.message);
            }
        }

        // ---- Wisp接続断(MuxTaskEnded等)の自動検知・再接続 ----
        let retryCount = 0;
        const MAX_RETRIES = 2;

        function loadWithRetry(url) {
            const frame = document.getElementById('siteFrame');

            // __uv$config(uv.config.jsで定義)のエンコード方式を使う
            const finalProxyUrl = __uv$config.prefix + __uv$config.encodeUrl(url);

            frame.onload = async () => {
                hideLoading();

                let isUvErrorPage = false;
                let traceText = '';
                try {
                    const doc = frame.contentDocument;
                    if (doc && doc.getElementById('errorTitle')) {
                        isUvErrorPage = true;
                        const traceEl = doc.getElementById('errorTrace');
                        traceText = traceEl ? traceEl.value : '';
                    }
                } catch (e) {
                    // 同一オリジンでない等でアクセスできない場合は無視(通常のページとみなす)
                }

                if (isUvErrorPage) {
                    const isConnectionIssue = /MuxTaskEnded|Wisp|hyper_util|invalid MessagePort/i.test(traceText);

                    if (isConnectionIssue && retryCount < MAX_RETRIES) {
                        retryCount++;
                        showLoading();
                        try {
                            // 接続を強制的に張り直してから再読み込み
                            await connection.setTransport('/epoxy/index.mjs', [{
                                wisp: (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/wisp/'
                            }]);
                            frame.src = finalProxyUrl;
                        } catch (err) {
                            showErrorToast("再接続に失敗しました: " + err.message);
                        }
                        return;
                    }

                    if (isConnectionIssue) {
                        showErrorToast("接続が不安定なため読み込みに失敗しました。もう一度お試しください。\n" + traceText);
                    } else {
                        showErrorToast(traceText || "ページの読み込みに失敗しました。");
                    }
                    return;
                }

                // 正常に読み込めたのでリトライカウントをリセット
                retryCount = 0;
            };

            frame.src = finalProxyUrl;
        }

        // 他のページ(Apps Script等)から ?url=<URL> で開かれた場合、
        // 自分のUIは隠して自動でその中身だけを読み込む
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(location.search);
            const target = params.get('url');
            if (target) {
                document.body.classList.add('embedded');
                document.getElementById('urlInput').value = target;
                goProxy();
            }
        });
    </script>
</body>
</html>
