<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>UV Proxy Client</title>
    <!-- 安定版のCDNを使用 -->
    <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@2/dist/index.js"></script>
</head>
<body style="background: #0d1117; color: #c9d1d9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div id="loading"><h3 id="msg">初期化中...</h3></div>
    <div id="app" style="display: none; width: 400px; text-align: center;">
        <input id="url" placeholder="URLを入力" style="width: 100%; padding: 10px; background: #161b22; color: #fff; border: 1px solid #30363d; box-sizing: border-box;" />
        <button onclick="go()" style="width: 100%; padding: 10px; margin-top: 10px; background: #238636; border: none; color: #fff; cursor: pointer;">GO</button>
    </div>

    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv.config.js"></script>

    <script>
        (async () => {
            try {
                const msg = document.getElementById('msg');
                msg.textContent = 'BareMux通信確立中...';

                // worker.jsを読み込み、接続を待機
                const workerUrl = 'https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@2/dist/worker.js';
                const connection = new BareMux.BareMuxConnection(workerUrl);

                // トランスポートを設定（Wispを使用）
                await connection.setTransport('https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@2/dist/index.mjs', [{ wisp: 'wss://wisp.tomp.app/' }]);
                
                msg.textContent = 'Service Worker登録中...';
                await navigator.serviceWorker.register('/sw.js', { scope: __uv$config.prefix });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            } catch (err) {
                console.error(err);
                document.getElementById('msg').textContent = 'エラー: ' + err.message;
            }
        })();

        function go() {
            let url = document.getElementById('url').value.trim();
            if (!url) return;
            if (!url.startsWith('http')) url = 'https://' + url;
            location.href = __uv$config.prefix + __uv$config.encodeUrl(url);
        }
    </script>
</body>
</html>
