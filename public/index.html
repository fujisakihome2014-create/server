<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Client</title>
    <!-- bare-mux / Ultraviolet に必要なスクリプトを読み込む -->
    <script src="/baremux/index.js"></script>
    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        body, html {
          height: 100%;
          width: 100%;
          font-family: 'Roboto', 'Arial', sans-serif;
          background-color: #0d1117;
          color: #c9d1d9;
          overflow: hidden;
          opacity: 0;
          animation: fadeInPage 0.5s ease forwards;
        }

        @keyframes fadeInPage {
          to { opacity: 1; }
        }

        #topBar {
          display: flex;
          flex-direction: row;
          align-items: center;
          width: 100%;
          gap: 8px;
          padding: 12px;
          background: #0d1117;
          z-index: 100;
          position: relative;
        }

        #urlForm {
          display: flex;
          align-items: center;
          flex: 1;
        }

        .url-bar-wrapper {
          position: relative;
          background-color: #161b22;
          border: 1px solid #30363d;
          border-radius: 6px;
          padding: 4px 8px;
          display: flex;
          align-items: center;
          height: 44px;
          width: 100%;
          box-shadow: 0 1px 0 rgba(27, 31, 36, 0.04);
          transition: all 0.3s ease;
        }

        .url-bar-wrapper:focus-within {
          border-color: transparent;
          background-image:
            linear-gradient(#161b22, #161b22),
            linear-gradient(135deg, #38bdf8, #60a5fa, #2563eb, #38bdf8);
          background-origin: border-box;
          background-clip: padding-box, border-box;
          background-size: 100% 100%, 300% 300%;
          box-shadow: 0 0 14px rgba(56, 189, 248, 0.28), 0 0 6px rgba(37, 99, 235, 0.28);
          animation: gradientDrift 9s ease-in-out infinite;
        }

        @keyframes gradientDrift {
          0%   { background-position: 0% 0%, 0% 40%; }
          22%  { background-position: 0% 0%, 65% 20%; }
          41%  { background-position: 0% 0%, 30% 80%; }
          63%  { background-position: 0% 0%, 90% 65%; }
          80%  { background-position: 0% 0%, 15% 55%; }
          100% { background-position: 0% 0%, 0% 40%; }
        }

        #urlInput {
          width: 100%;
          background: transparent;
          border: none;
          color: #f0f6fc;
          font-size: 14px;
          padding: 0 8px;
          outline: none;
        }

        #urlInput::placeholder {
          color: #6e7681;
        }

        #viewArea {
          position: relative;
          height: calc(100% - 68px);
          width: calc(100% - 24px);
          margin: 0 12px 12px 12px;
          background-color: #161b22;
          border: 1px solid #30363d;
          border-radius: 6px;
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }

        #siteFrame {
          width: 100%;
          height: 100%;
          border: none;
          background-color: #161b22;
          position: relative;
          z-index: 2;
        }

        #overlay {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -40%);
          background-color: #161b22;
          border: 1px solid #30363d;
          padding: 16px 24px;
          border-radius: 8px;
          display: flex;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          z-index: 10;
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
          text-align: center;
          opacity: 0;
          visibility: hidden;
          transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
        }

        #overlay.active {
          opacity: 1;
          visibility: visible;
          transform: translate(-50%, -50%);
        }

        .spinner {
          width: 22px;
          height: 22px;
          border: 2px solid #30363d;
          border-top-color: #38bdf8;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
          margin-bottom: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #statusText {
          font-size: 13px;
          color: #c9d1d9;
        }

        #errorToast {
          position: absolute;
          top: 16px;
          right: 16px;
          background: rgba(248, 81, 73, 0.15);
          border: 1px solid rgba(248, 81, 73, 0.4);
          color: #f85149;
          padding: 12px 16px;
          border-radius: 6px;
          font-size: 13px;
          z-index: 1000;
          box-shadow: 0 4px 16px rgba(0,0,0,0.5);
          opacity: 0;
          visibility: hidden;
          transform: translateY(-15px);
          transition: all 0.3s ease;
          max-width: 520px;
          width: 100%;
        }

        #errorToast.active {
          opacity: 1;
          visibility: visible;
          transform: translateY(0);
        }

        .error-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-weight: bold;
          margin-bottom: 6px;
          border-bottom: 1px solid rgba(248, 81, 73, 0.3);
          padding-bottom: 4px;
        }

        .error-time {
          font-size: 11px;
          color: #8b949e;
          font-weight: normal;
        }

        .error-detail {
          font-family: monospace;
          font-size: 11px;
          color: #ff7b72;
          word-break: break-all;
          white-space: pre-wrap;
          line-height: 1.4;
          max-height: 200px;
          overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="topBar">
        <div id="urlForm">
            <div class="url-bar-wrapper">
                <input id="urlInput" placeholder="URLまたは検索ワードを入力" onkeydown="if(event.key === 'Enter') goProxy();" autocomplete="off" spellcheck="false" />
            </div>
        </div>
    </div>

    <div id="viewArea">
        <div id="overlay">
            <div class="spinner"></div>
            <div id="statusText">プロキシ経由で接続中...</div>
        </div>
        <iframe id="siteFrame" name="siteFrame" onload="hideLoading()"></iframe>
    </div>

    <div id="errorToast">
        <div class="error-header">
            <span>⚠️ システム・リソースエラー通知</span>
            <span id="errorTime" class="error-time"></span>
        </div>
        <div id="errorDetail" class="error-detail"></div>
    </div>

    <script src="/register-sw.js"></script>
    <script>
        let errorTimer = null;
        let loadTimeoutTimer = null;
        let isNavigating = false;

        // bare-mux接続(ページを跨いで保持し続ける必要があるため、iframe遷移方式と組み合わせる)
        const connection = new BareMux.BareMuxConnection('/baremux/worker.js');

        function showErrorToast(errorText) {
            hideLoading();
            const errorToast = document.getElementById('errorToast');
            const errorDetail = document.getElementById('errorDetail');
            const errorTime = document.getElementById('errorTime');

            const now = new Date();
            errorTime.textContent = now.toLocaleTimeString();

            errorDetail.textContent = errorText;
            errorToast.classList.add('active');

            if (errorTimer) clearTimeout(errorTimer);
            errorTimer = setTimeout(() => {
                errorToast.classList.remove('active');
            }, 15000);
        }

        function showLoading() {
            isNavigating = true;
            document.getElementById('overlay').classList.add('active');

            if (loadTimeoutTimer) clearTimeout(loadTimeoutTimer);
            loadTimeoutTimer = setTimeout(() => {
                if (isNavigating) {
                    showErrorToast("タイムアウト: 15秒以内にサーバーから応答がありませんでした。");
                    isNavigating = false;
                }
            }, 15000);
        }

        function hideLoading() {
            isNavigating = false;
            document.getElementById('overlay').classList.remove('active');
            if (loadTimeoutTimer) {
                clearTimeout(loadTimeoutTimer);
                loadTimeoutTimer = null;
            }
        }

        async function ensureTransportReady() {
            // Service Workerを登録
            await registerSW();

            // wisp接続先(このサーバー自身)をtransportとして設定
            const wispUrl =
                (location.protocol === 'https:' ? 'wss' : 'ws') +
                '://' + location.host + '/wisp/';

            if ((await connection.getTransport()) !== '/epoxy/index.mjs') {
                await connection.setTransport('/epoxy/index.mjs', [{ wisp: wispUrl }]);
            }
        }

        async function goProxy() {
            try {
                document.getElementById('errorToast').classList.remove('active');
                if (errorTimer) clearTimeout(errorTimer);

                let rawInput = document.getElementById('urlInput').value;
                let url = rawInput.trim();

                if (!url) {
                    showErrorToast("ValidationError: URL入力欄が空です。");
                    return;
                }

                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    if (url.includes('.') && !url.includes(' ')) {
                        url = 'https://' + url;
                    } else {
                        url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
                    }
                }

                showLoading();

                try {
                    await ensureTransportReady();
                } catch (err) {
                    showErrorToast("接続の初期化に失敗しました: " + err.message);
                    return;
                }

                // __uv$config(uv.config.jsで定義)のエンコード方式を使う
                const finalProxyUrl = __uv$config.prefix + __uv$config.encodeUrl(url);
                document.getElementById('siteFrame').src = finalProxyUrl;

            } catch (err) {
                showErrorToast("予期しないエラーが発生しました: " + err.message);
            }
        }
    </script>
</body>
</html>
