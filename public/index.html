<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Secure Proxy Portal</title>
    <!-- コア処理と設定の読み込み -->
    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv.config.js"></script>
</head>
<body style="background: #0d1117; color: #c9d1d9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div id="loading">
        <h3 id="msg">プロキシシステムを初期化中...</h3>
    </div>
    <div id="app" style="display: none; width: 450px; text-align: center; background: #161b22; padding: 30px; border-radius: 8px; border: 1px solid #30363d;">
        <h2 style="margin-top: 0; color: #f0f6fc;">Web Proxy</h2>
        <input id="url" placeholder="URLを入力 (例: https://google.com)" onkeydown="if(event.key === 'Enter') go();" style="width: 100%; padding: 12px; background: #0d1117; color: #fff; border: 1px solid #30363d; border-radius: 4px; box-sizing: border-box; outline: none;" />
        <button onclick="go()" style="width: 100%; padding: 12px; margin-top: 15px; background: #238636; border: none; color: #fff; border-radius: 4px; font-weight: bold; cursor: pointer;">アクセスする</button>
    </div>

    <script>
        (async () => {
            try {
                const msg = document.getElementById('msg');
                msg.textContent = 'Service Workerを登録中...';

                // 古い登録を掃除
                const regs = await navigator.serviceWorker.getRegistrations();
                for (let reg of regs) {
                    await reg.unregister();
                }

                // サービスワーカーの登録
                await navigator.serviceWorker.register('/sw.js', { scope: '/' });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            } catch (err) {
                console.error(err);
                document.getElementById('msg').textContent = '初期化エラー: ' + err.message;
            }
        })();

        function go() {
            let url = document.getElementById('url').value.trim();
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            // URLをエンコードしてプロキシ空間へ転送
            location.href = __uv$config.prefix + __uv$config.encodeUrl(url);
        }
    </script>
</body>
</html>
